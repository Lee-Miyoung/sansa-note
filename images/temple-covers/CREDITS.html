<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>산사노트 그림 안내</title><main><h1>장소별 수채화 자료</h1><p>그림은 참고 자료를 바탕으로 새로 만든 창작 수채화이며 현장 사진이 아닙니다.</p><a href="/docs/catalog-complete/CREDITS.html">전체 참고 자료·이용 조건·검토 및 미완료 목록 보기</a><section><h2>사성암</h2><p>공유마당의 한국교육방송공사 사진과 전라남도 소개 자료를 형태 검토에 참고해 산사노트용 수채화를 새로 제작했습니다. 현장 사진이나 정밀 실측 복원도가 아닙니다. 참고 사진을 생성 도구에 제공하지 않았습니다.</p><a href="/docs/courses/20261112/saseongam-research.json">출처·권리 정보·원본 및 검토 내용</a></section></main></html>
