name: Atlas publication rules
on:
  pull_request:
    branches: [main]
    paths: ['docs/atlas-publication/**', 'tests/atlas-publication-rules/**', '.github/workflows/atlas-publication-rules.yml']
  push:
    branches: [feat/public-haeinsa-atlas]
    paths: ['docs/atlas-publication/**', 'tests/atlas-publication-rules/**', '.github/workflows/atlas-publication-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-sansa-atlas-publication
      GOOGLE_CLOUD_PROJECT: demo-sansa-atlas-publication
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_TOKEN: ''
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned emulator test dependencies
        run: npm install --prefix /tmp/atlas-rules --no-save --no-package-lock @firebase/rules-unit-testing@6.0.0 firebase@13.0.0 firebase-tools@15.34.0
      - name: Test full integrated rules in demo emulator only
        env:
          NODE_PATH: /tmp/atlas-rules/node_modules
        run: /tmp/atlas-rules/node_modules/.bin/firebase emulators:exec --only database --project demo-sansa-atlas-publication --config tests/atlas-publication-rules/firebase.json "node tests/atlas-publication-rules/test.cjs"
